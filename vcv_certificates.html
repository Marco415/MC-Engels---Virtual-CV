<!DOCTYPE html>
<html lang="en">
	<head>		
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="author" content="Marco Engels">
		<meta charset="UTF-8">
		<title>MC Engels Virtual CV - Certificates</title>
		
		<link rel="stylesheet" href="styles_nav.css">
		<link rel="stylesheet" href="styles_text.css">
		<link rel="stylesheet" href="styles_visuals.css">
		<link rel="icon" type="image/x-icon" href="images/favicon.ico">
	</head>
	<body>
		<!-- Header -->
		<header class="heading">
			<h1>Marco Engels</h1>
			<p class="subtitle">Virtual Curriculum Vitae</p>
		</header>

		<!-- Navigation -->
		<nav>
			<a href="index.html" title="Go To Home Page">Home</a>
			<a href="vcv_resume.html" title="Go To Resume Page">Resume</a>
			<a href="vcv_projects.html" title="Go To Projects Page">Projects</a>
			<a href="vcv_certificates.html" class="active" title="Go To Certificates Page">Certificates</a>
		</nav>

		<!-- Certificate selector -->
		<div class="select-bar">
			<div class="select-group">
				<label for="certificateSelect">Certificate</label>
				<select id="certificateSelect" name="certificate" title="Select a certificate from the list">
					<option value="bscit" selected>BSc in Information Technology</option>
					<option value="goldenkey">Golden Key Member Certificate</option>
					<option value="cybersecurity">Introduction to Cyber Security</option>
					<option value="packettracer">Introduction to Packet Tracer</option>
					<option value="matlab">MATLAB Onramps</option>
				</select>
			</div>

			<div id="matlabSelectContainer" style="display:none;" class="select-group">
				<label for="matlabSelect">MATLAB Course</label>
				<select id="matlabSelect">
					<option value="app_building">App Building Onramp</option>
					<option value="computer_vision">Computer Vision Onramp</option>
					<option value="core_matlab_skills">Core MATLAB Skills</option>
					<option value="data_analysis">Data Analysis in MATLAB</option>
					<option value="deep_learning">Deep Learning Onramp</option>
					<option value="image_processing">Image Processing Onramp</option>
					<option value="machine_learning">Machine Learning Onramp</option>
					<option value="matlab_onramp">MATLAB Onramp</option>
					<option value="statistics">Statistics Onramp</option>
					<option value="visualization">Visualization in MATLAB</option>
				</select>
			</div>
		</div>

		<!-- Certificate display -->
		<div class="image-frame">
			<img src="images/Introduction_to_Cyber_Security_certificate.jpg" 
			     alt="Introduction to Cyber Security certificate" 
			     id="certificateDisplay" 
			     class="image">
		</div>

		<script>
			const docSelect      = document.getElementById("certificateSelect");
			const matlabSelect   = document.getElementById("matlabSelect");
			const matlabContainer= document.getElementById("matlabSelectContainer");
			const docDisplay     = document.getElementById("certificateDisplay");

			function updateDocument() {
				const val = docSelect.value;
				matlabContainer.style.display = "none";

				if (val === "bscit") {
					docDisplay.src = "images/BSc_IT.jpg";
					docDisplay.alt = "BSc in Information Technology";
				} else if (val === "cybersecurity") {
					docDisplay.src = "images/Introduction_to_Cyber_Security_certificate.jpg";
					docDisplay.alt = "Introduction to Cyber Security certificate";
				} else if (val === "packettracer") {
					docDisplay.src = "images/Introduction_to_Packet_Tracer_certificate.jpg";
					docDisplay.alt = "Introduction to Packet Tracer certificate";
				} else if (val === "goldenkey") {
					docDisplay.src = "images/Golden_Key_Member_Certificate_-_Marthinus_Christoffel_Engels.jpg";
					docDisplay.alt = "Golden Key Member Certificate";
				} else if (val === "matlab") {
					matlabContainer.style.display = "flex";
					updateMatlabCertificate();
				}
			}

			function updateMatlabCertificate() {
				const names = {
					app_building:      "App Building Onramp",
					computer_vision:   "Computer Vision Onramp",
					core_matlab_skills:"Core MATLAB Skills",
					data_analysis:     "Data Analysis in MATLAB",
					deep_learning:     "Deep Learning Onramp",
					image_processing:  "Image Processing Onramp",
					machine_learning:  "Machine Learning Onramp",
					matlab_onramp:     "MATLAB Onramp",
					statistics:        "Statistics Onramp",
					visualization:     "Visualization in MATLAB"
				};
				const name = names[matlabSelect.value];
				docDisplay.src = `images/matlab/${name}.jpg`;
				docDisplay.alt = `${name} Certificate`;
			}

			docSelect.addEventListener("change", updateDocument);
			matlabSelect.addEventListener("change", updateMatlabCertificate);
			updateDocument();
		</script>
	</body>
</html>
